# Generated by terminus-settings from lib/skins/mako.ini; edit settings, not this file.
include=~/.local/share/terminus-est/default/mako/core.ini
default-timeout=5000
ignore-timeout=1

text-color={{foreground}}
border-color={{accent}}
background-color={{glass_alpha}}
border-size=1
# Matches the floating-window rounding in config/hyprland/look_and_feel.lua.
border-radius=12
font={{ui_font}} 10
format=<span foreground="{{accent_dim}}" size="small">%a</span>\n<b>%s</b>\n<span foreground="{{muted}}">%b</span>

[urgency=critical]
border-color={{alert}}

[app-name=Screenshot]
max-icon-size=96
