# Laptop: screensaver after 7 minutes, lock after 10, suspend after 30.
general {
    ignore_wayland_inhibit = true
    lock_cmd = terminus-lock force
    before_sleep_cmd = terminus-lock force
    after_sleep_cmd = terminus system wake
    inhibit_sleep = 3
}

listener {
    timeout = 420
    on-timeout = terminus-screensaver
    on-resume = terminus-screensaver --resume
}

listener {
    timeout = 600
    on-timeout = terminus-lock force && terminus-brightness-display off
    on-resume = terminus system wake
}

listener {
    timeout = 1800
    on-timeout = terminus-lock --suspend
}
