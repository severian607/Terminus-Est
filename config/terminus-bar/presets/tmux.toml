# Terminus-Bar style preset 'tmux': one status line. Inverted accent session block left,
# workspaces as a window list, dim-label/value segments right, inverted clock block far right.
# Apply with: terminus-bar-style set tmux

[bar]
order = ["default"]

[bar.default]
position = "top"
thickness = 24
background_opacity = 1.0
border_width = 0.0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 28
radius_bottom_right = 28
concave_edge_corners = true
margin_ends = 0
margin_edge = 0
padding = 0
widget_spacing = 8
shadow = false
reserve_space = true
hover_highlight = false
font_weight = 500
color = "on_surface_variant"
icon_color = "on_surface_variant"
capsule = false
capsule_fill = "primary"
capsule_foreground = "surface"
capsule_radius = 0.0
capsule_padding = 10.0
capsule_opacity = 1.0
capsule_thickness = 1.0
start = ["session", "workspaces", "clipboard-shortcut"]
center = []
end = [
    "weather", "sep1", "media", "sep2", "audio-visualizer", "tray", "bluetooth", "sep3",
    "volume", "brightness", "sep4", "ram", "sep6", "gpu", "cat", "sep5", "rx", "tx", "clock"
]

    [bar.default.monitor.HDMI-A-1]
    enabled = false

[widget.session]
type = "custom_button"
glyph = ""
label = "[0] terminus-est"
tooltip = "Launcher"
capsule = true
capsule_fill = "primary"
color = "surface"
capsule_padding = 12.0

    [widget.session.actions]
    left = "exec terminus-launcher toggle"

[widget.workspaces]
style = "regular"
label_source = "id"
show_labels = true
focused_color = "primary"
occupied_color = "surface"
empty_color = "surface"
change_color_on_hover = false
hide_when_empty = false
active_pill_size = 1.6
inactive_pill_size = 1.6
pill_scale = 1.0

[widget.clipboard-shortcut]
type = "custom_button"
glyph = "clipboard"
label = ""
tooltip = "Open clipboard history"
color = "on_surface_variant"
capsule_padding = 10.0

    [widget.clipboard-shortcut.actions]
    left = "exec terminus-bar msg panel-toggle clipboard"

[widget.sep1]
type = "text"
text = "│"
color = "outline"
[widget.sep2]
type = "text"
text = "│"
color = "outline"
[widget.sep3]
type = "text"
text = "│"
color = "outline"
[widget.sep4]
type = "text"
text = "│"
color = "outline"
[widget.sep6]
type = "text"
text = "│"
color = "outline"
[widget.sep5]
type = "text"
text = "│"
color = "outline"

[widget.weather]
color = "on_surface"
icon_color = "on_surface_variant"
max_length = 80
show_condition = false
show_temperature = true
capsule_padding = 10.0

[widget.media]
color = "on_surface"
icon_color = "on_surface_variant"

[widget.audio-visualizer]
centered = true
mirrored = false
show_when_idle = false
color_1 = "on_surface_variant"
color_2 = "primary"
type = "audio_visualizer"

[widget.tray]
color = "on_surface_variant"

[widget.bluetooth]
color = "on_surface"
icon_color = "on_surface_variant"

[widget.volume]
color = "on_surface"
icon_color = "on_surface_variant"
mute_color = "error"

[widget.brightness]
color = "on_surface"
icon_color = "on_surface_variant"
show_when_unavailable = true

[widget.ram]
type = "sysmon"
highlight_color = "primary"
stat = "ram_pct"
visualization = "none"
show_glyph = false
custom_label = "mem"
color = "on_surface"
icon_color = "on_surface_variant"

[widget.gpu]
type = "sysmon"
highlight_color = "primary"
stat = "gpu_usage"
visualization = "none"
show_glyph = false
custom_label = "gpu"
color = "on_surface"

[widget.cat]
type = "dotnetrob/cat:cat"
cat_color = "primary"
cat_color_mode = "custom"
show_cpu_percent = true

[widget.rx]
type = "sysmon"
highlight_color = "primary"
stat = "net_rx"
visualization = "none"
show_glyph = false
custom_label = "rx"
network_speed_compact = true
network_speed_unit = "mb"
color = "on_surface"

[widget.tx]
type = "sysmon"
highlight_color = "primary"
stat = "net_tx"
visualization = "none"
show_glyph = false
custom_label = "tx"
network_speed_compact = true
network_speed_unit = "mb"
color = "on_surface"

[widget.clock]
format = "{:%H:%M}  {:%a %d %b}"
tooltip_format = "{:%A, %d %B %Y}"
capsule = true
capsule_fill = "primary"
color = "surface"
capsule_padding = 12.0
