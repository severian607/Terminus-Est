shape {
    monitor =
    size = 28, 1
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = -316, -180
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 1, 28
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = -330, -166
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 28, 1
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = -316, 290
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 1, 28
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = -330, 276
    halign = center
    valign = center
    zindex = 0
