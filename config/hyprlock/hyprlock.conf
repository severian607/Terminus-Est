# Terminus-Bar lock screen (laptop). Mirrors the root rail: flat #0b0b0b bars, 27px thick, square corners,
# MonaspiceNe Nerd Font, bracketed clock, "::" date, phosphor-green accent, orange alert.

$font = MonaspiceNe Nerd Font
$fg = rgba(236, 236, 236, 1.0)
$muted = rgba(140, 140, 140, 1.0)
$accent = rgba(134, 217, 147, 1.0)
$rail = rgba(11, 11, 11, 1.0)

# Freeze each output at lock time, then soften and darken so the context stays recognizable
# without leaving page text readable.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.90
    brightness = 0.46
    vibrancy = 0.05
    vibrancy_darkness = 0.3
    zindex = -2
}

general {
    screensaver = false
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = railEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, railEase
    animation = fadeOut, 1, 3.5, railEase
    animation = inputFieldColors, 1, 4, railEase
    animation = inputFieldDots, 1, 3, railEase
}

# ---- top rail ------------------------------------------------------------------------------
shape {
    monitor =
    size = 100%, 27
    color = $rail
    rounding = 0
    position = 0, 0
    halign = center
    valign = top
    zindex = 0
}

label {
    monitor =
    text = cmd[update:0] echo "󰌾  $USER@$(cat /etc/hostname)"
    color = $accent
    font_size = 12
    font_family = $font
    position = 10, -5
    halign = left
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:30000] date +"[ %H:%M ]"
    color = $fg
    font_size = 12
    font_family = $font
    position = 0, -5
    halign = center
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%  $(cat /sys/class/power_supply/BAT0/status)"
    color = $accent
    font_size = 12
    font_family = $font
    position = -10, -5
    halign = right
    valign = top
    zindex = 1
}

# ---- centre --------------------------------------------------------------------------------
