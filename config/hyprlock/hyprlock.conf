}

shape {
    monitor =
    size = 1, 28
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = 330, -166
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 28, 1
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = 316, 290
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 1, 28
    color = rgba(134, 217, 147, 0.60)
    rounding = 0
    position = 330, 276
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = ──────────────  󰌾  ──────────────
    color = rgba(134, 217, 147, 0.85)
    font_size = 15
    font_family = $font
    position = 0, 235
    halign = center
    valign = center
}

label {
    monitor =
    text = [ LOCKED ]
    color = $accent
    font_size = 14
    font_family = $font
    position = 0, 195
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 128
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a :: %d.%m.%Y"
    color = $muted
    font_size = 18
    font_family = $font
    position = 0, -2
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $HOME/.config/terminus-est/hyprlock/day-bar.sh
    color = rgba(134, 217, 147, 0.70)
    font_size = 13
    font_family = $font
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = ╾────────────  ◆  ────────────╼
    color = rgba(140, 140, 140, 0.55)
    font_size = 12
    font_family = $font
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 44
    position = 0, -125
    halign = center
    valign = center

    inner_color = rgba(11, 11, 11, 0.88)
    outer_color = rgba(134, 217, 147, 0.55)
    outline_thickness = 1
    rounding = 0
    shadow_passes = 0

    font_family = $font
    font_color = $fg
    placeholder_text = <span foreground="##8c8c8c">[ password ]</span>
    check_color = rgba(134, 217, 147, 1.0)
    fail_color = rgba(232, 160, 122, 1.0)
    fail_text = <span foreground="##e8a07a">[ access denied ]</span>
    capslock_color = rgba(215, 201, 168, 1.0)

    dots_center = true
    dots_size = 0.22
    dots_spacing = 0.25
    dots_rounding = 0
    fade_on_empty = false
    zindex = 2
}

label {
    monitor =
    text = type your password and press enter
    color = rgba(140, 140, 140, 0.60)
    font_size = 11
    font_family = $font
    position = 0, -170
    halign = center
    valign = center
}

# ---- readout panels ------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:15000] $HOME/.config/terminus-est/hyprlock/panel-system.sh
    color = rgba(134, 217, 147, 0.80)
    font_size = 12
    font_family = $font
    text_align = left
    position = 24, 48
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:15000] $HOME/.config/terminus-est/hyprlock/panel-power.sh
    color = rgba(134, 217, 147, 0.80)
    font_size = 12
    font_family = $font
    text_align = left
    position = -24, 48
    halign = right
    valign = bottom
    zindex = 1
}

# ---- bottom rail ---------------------------------------------------------------------------
shape {
    monitor =
    size = 100%, 27
    color = $rail
    rounding = 0
    position = 0, 0
    halign = center
    valign = bottom
    zindex = 0
}

label {
    monitor =
    text = terminus :: session locked
    color = $muted
    font_size = 12
    font_family = $font
    position = 10, 5
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 12
    font_family = $font
    position = -10, 5
    halign = right
    valign = bottom
    zindex = 1
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = false
    }
}
