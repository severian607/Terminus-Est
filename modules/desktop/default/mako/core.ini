anchor=top-right
group-by=app-name,summary,body
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
max-icon-size=32
font=sans-serif 14px

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'terminus-notification-dismiss "Learn Keybindings"; terminus-menu-keybindings'

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
