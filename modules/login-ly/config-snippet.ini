# Terminus-Est login keys for /etc/ly/config.ini (install.sh sets these for you).
# Needs the ly-1.4.1-1.2 package; older Ly builds refuse unknown values.

# One star per typed character; lines join them when the password is accepted.
# asterisk | constellation   (asterisk = stock Ly behaviour)
password_style = constellation

# Night sky: drifting stars, a dying sun bleeding into the sky, a grass field with
# the Terminus-Est sword, CRT scan band, boot-log ticker.
# none | doom | matrix | colormix | gameoflife | dur_file | terminus
animation = terminus

# 40 ms (25 fps) is plenty for this animation and cheap on kmscon.
animation_frame_delay = 40

# Accent: the sword colour from fastfetch. Stars, sun, box border and the
# constellation all derive from it.
border_fg = 0x0096574E
