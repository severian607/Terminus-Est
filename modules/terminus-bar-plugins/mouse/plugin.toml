id           = "terminus/mouse"
name         = "Mouse"
version      = "1.0.0"
plugin_api   = 14
author       = "terminus"
license      = "MIT"
dependencies = []
icon         = "cpu"
description  = "An animated running mouse bar widget whose speed reflects GPU usage."
tags         = ["bar", "animation", "system", "fun"]

[[widget]]
id    = "mouse"
entry = "mouse.luau"

  # The click panel lives in the terminus/vitals plugin (the gpu view).
  [widget.actions]
  left = "panel-toggle terminus/vitals:vitals gpu"

  [[widget.setting]]
  key              = "mouse_size"
  type             = "int"
  label_key        = "settings.mouse_size.label"
  description_key  = "settings.mouse_size.description"
  default          = 24
  min              = 12
  max              = 48

  [[widget.setting]]
  key              = "show_gpu_percent"
  type             = "bool"
  label_key        = "settings.show_gpu_percent.label"
  description_key  = "settings.show_gpu_percent.description"
  default          = false

  [[widget.setting]]
  key              = "walk_threshold"
  type             = "int"
  label_key        = "settings.walk_threshold.label"
  description_key  = "settings.walk_threshold.description"
  default          = 15
  min              = 0
  max              = 100

  [[widget.setting]]
  key              = "run_threshold"
  type             = "int"
  label_key        = "settings.run_threshold.label"
  description_key  = "settings.run_threshold.description"
  default          = 60
  min              = 0
  max              = 100

  [[widget.setting]]
  key              = "poll_interval"
  type             = "int"
  label_key        = "settings.poll_interval.label"
  description_key  = "settings.poll_interval.description"
  default          = 2
  min              = 1
  max              = 10

  [[widget.setting]]
  key              = "mouse_color_mode"
  type             = "select"
  label_key        = "settings.mouse_color_mode.label"
  description_key  = "settings.mouse_color_mode.description"
  default          = "theme"
  options          = [
    { value = "theme", label_key = "settings.mouse_color_mode.option_theme" },
    { value = "custom", label_key = "settings.mouse_color_mode.option_custom" },
  ]

  [[widget.setting]]
  key              = "mouse_color"
  type             = "color"
  label_key        = "settings.mouse_color.label"
  description_key  = "settings.mouse_color.description"
  default          = "#C9A0A0"
  visible_when     = { key = "mouse_color_mode", values = ["custom"] }
